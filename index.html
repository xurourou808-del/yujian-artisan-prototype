<div class="app"><header class="top"><strong>隅间手艺人</strong><button data-page="消息">消息 <span class="dot" id="badge"></span></button></header><main id="main"></main><nav class="nav" aria-label="主导航" id="nav"></nav></div>
<dialog id="dialog" aria-labelledby="title"><div class="sheet-head"><h2 id="title"></h2><button id="close" aria-label="关闭">×</button></div><div class="sheet" id="sheet"></div></dialog><div role="status" class="toast" id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);

const intro=(title,desc)=>`<div class="intro"><h1>${title}</h1><p>${desc}</p></div>`;
const section=(title,action='')=>`<div class="section"><h2>${title}</h2>${action}</div>`;
const button=(label,id,style='soft')=>`<button class="${style}" data-open="${id}">${label}</button>`;
const row=(label,desc,id,end='›')=>`<button class="row" data-open="${id}"><span><strong>${label}</strong><br><small>${desc}</small></span><span>${end}</span></button>`;
function home(){return '<div class="store-heading">城西银泰店</div>'+
`<section class="hero learning-hero"><div class="learning-art" aria-hidden="true"><img class="learning-character" src="./yujian-artisan-assets/learning-character.png" alt=""></div><div class="cover-greeting"><strong>天天，下午好</strong><p>又是美好的一天</p></div><div class="learning-info"><div><h2>理论题库</h2><p>上一次得分 ${state.score} 分</p></div>${button('继续答题','quiz','cta')}</div></section>
<div class="card notice split"><div><span class="tag">复训通知</span><h3>11 月 12 日 14:00 · 手法复训</h3></div>${button('查看','training')}</div>`+
section('服务技巧')+`<div class="card tip-card">${row('<span class="media"><span class="thumb">▷</span>顾客觉得力度太轻，怎么处理？</span>','服务小贴士 · 力度沟通','tip')}</div>`+
section('手艺人短报')+`<div class="card story-card"><span class="tag">匠心服务</span><h3>记住客人每次都想加强的肩颈</h3><p>宝龙店 · 贝贝</p><div class="split"><button data-act="vote" aria-pressed="${state.voted}">${state.voted?'已送藕尖':'送藕尖'} · ${state.voted?19:18}</button><button class="soft" data-open="story">读故事</button></div></div>`+
(state.story?'<div class="card"><span class="tag">待核实</span> <strong>我的故事提报</strong></div>':'')}
const shortcuts=[
 ['提报排休','leave','M5 5h14v15H5z M8 3v4 M16 3v4 M5 10h14'],
 ['复训安排','training','M4 6q4-2 8 1 4-3 8-1v13q-4-2-8 0-4-2-8 0z M12 7v12']
];
const demoAssignment={name:'林女士',service:'肩颈舒缓 · 60 分钟',pressure:'偏重',focus:'肩颈、上背',avoid:'颈前',oil:'薰衣草'};
const floorSchedule=[
 {name:'贝贝',state:'free',status:'空闲'},
 {name:'天天',state:'free',status:'空闲'},
 {name:'丽丽',state:'free',status:'空闲'},
 {name:'小雨',state:'working',status:'余 20′'},
 {name:'小满',state:'off',status:'圈排中'},
 {name:'安安',state:'off',status:'已下班'}

function rotation(){
 const roster=floorSchedule.map(artisan=>artisan.name==='天天'&&state.assignment?{...artisan,state:'working',status:'待上钟'}:artisan);
 const available=roster.filter(artisan=>artisan.state==='free');
 const ownIndex=available.findIndex(artisan=>artisan.name==='天天');
 const rows=roster.map(artisan=>
  `<li><div class="rotation-person"><strong>${artisan.name}</strong></div><span class="rotation-status ${artisan.state}">${artisan.status}</span></li>`
 ).join('');
 return `<section class="card rotation"><div class="split"><h2>今日排班</h2><small>${state.assignment?'我已排到':ownIndex>0?`我前面还有 ${ownIndex} 位`:ownIndex===0?'下一位轮到我':'我暂未进入轮钟队列'}</small></div><ol class="rotation-grid">${rows}</ol></section>`;
}
function work(){
 const isCommission=state.workTab==='commission';
 const heading=`<div class="desk-heading"><h1>工作台</h1><p>杭州宝龙店 · 天天</p></div>
 <div class="work-tabs" aria-label="工作台视图"><button data-work-tab="rotation" aria-pressed="${!isCommission}">轮钟</button><button data-work-tab="commission" aria-pressed="${isCommission}">个人提成</button></div>`;
 if(isCommission)return heading+`<section class="work-commission" aria-label="个人提成">${commissionDetails()}</section>`;
 const assignment=state.assignment;
 const rotationStatus=assignment
  ? `<div class="split"><strong>${assignment.name}</strong><span class="tag">待上钟</span></div><p>${assignment.service}</p><button class="soft" data-open="assignedGuest">查看顾客信息</button>`
  : `<div class="split"><strong>预计 16:30 排到</strong><span class="tag">等待轮钟</span></div><p>根据今日轮钟和预约预估，以前台安排为准。</p>`;
 const quick=`<div class="desk-section"><h2>常用入口</h2></div><div class="shortcut-box" aria-label="快捷入口">${shortcuts.map(([label,id,path])=>`<button data-open="${id}"><span class="shortcut-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg></span>${id==='leave'&&state.leave?'排休待审核':label}</button>`).join('')}</div>`;
 return heading+`${rotation()}<section class="card own-rotation"><h2>我的轮钟</h2>${rotationStatus}</section><div class="demo-state" aria-label="原型状态预览"><small>原型预览</small><button class="soft" data-act="toggleAssignment">${assignment?'预览等待轮钟':'预览待上钟'}</button></div>`+quick

}
function performance(){return intro('个人业绩','11 月 1 日–11 月 10 日')+`<div class="grid"><button data-open="repeat"><small>30 天复购率</small><b>32%</b></button><button data-open="point"><small>点钟</small><b>12 次</b></button><button data-open="review"><small>线上好评</small><b>16 条</b></button></div>`+section('顾客反馈与服务品质')+`<div class="card">${row('线上好评率','查看好评数据说明','review')}${row('负面评价','2 条 · 手法 1 条 / 服务 1 条','negative')}${row('品质账户','96 分 · 查看扣分和罚单','quality')}</div>` + section('提升建议')+
 `<section class="card coaching-card">
  <article><small>来自负面评价 · 力度偏轻、调整后未确认</small><h3>调整力度后，再问一次</h3><p>服务前问清力度和重点部位。调整后，问一句「现在这个力度合适吗？」</p>${button('查看力度沟通技巧','tip')}</article>
  <article><small>来自品质账户 · 服务流程扣 4 分</small><h3>对照稽查记录复盘</h3><p>先查看具体扣分项，再对照该项门店服务标准练习。</p>${button('查看扣分记录','quality')}</article>
 </section>`
}

function mine(){return intro('我的','天天 · 杭州宝龙店')+`<div class="hero"><small>当前等级</small><h2>中级芳疗师</h2><p>下一等级 · 高级芳疗师</p>${button('查看升级宝典 ›','growth','cta')}</div>`+section('成长记录')+`<div class="card">${row('任职 6 个月','已获 2 次服务表彰','milestone')}${row('我的理论练习','最近得分 '+state.score+' 分','quiz')}${row('周年权益','查看里程碑','anniversary')}</div>`}
const messages=[['training','手法复训已安排','11 月 12 日 14:00–16:00'],['rejected','排休申请未通过','11 月 8 日 · 当日人手不足'],['tip','服务小贴士已更新','顾客觉得力度太轻，怎么处理？']];
function inbox(){return intro('消息','培训安排与门店通知')+`<div class="card">${messages.map(([id,label,desc])=>row(label,desc,id,state.read.has(id)?'›':'<span class="tag">未读</span>')).join('')}</div>`}
function render(){document.querySelector('.app').classList.toggle('learning-page',state.page==='首页');const screens={'首页':home,'工作台':work,'个人业绩':performance,'我的':mine,'消息':inbox};$('main').innerHTML=screens[state.page]();$('nav').innerHTML=pages.map((page,i)=>`<button data-page="${page}" ${page===state.page?'class="active" aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[i]}"/></svg>${page}</button>`).join('');$('badge').textContent=state.read.size===3?'':3-state.read.size}
const commissionEntries=[
 {id:'YJ202611130021',project:'肩颈舒缓',time:'11/13 16:30',duration:60,amount:68},
 {id:'YJ202611130014',project:'全身舒缓',time:'11/13 14:00',duration:90,amount:96},
 {id:'YJ202611120032',project:'肩背舒缓',time:'11/12 17:15',duration:60,amount:68}
];
// Standalone prototype fixtures for the summary and detail responses.
const commissionDates={today:'11/13',yesterday:'11/12',currentMonth:'11',lastMonth:'10'};
const commissionTotals={today:164,yesterday:68,currentMonth:232,lastMonth:0};
let commissionPeriod='today';
let commissionMonth='';
function commissionDetails(){
 const period=commissionPeriod;
 const isCustom=period==='custom';
 const selectedMonth=isCustom?commissionMonth.slice(5):commissionDates[period];
 const rows=isCustom&&commissionMonth.slice(0,4)!=='2026'?[]:
  commissionEntries.filter(entry=>entry.time.startsWith(selectedMonth));
 const total=isCustom?(commissionMonth==='2026-11'?commissionTotals.currentMonth:0):commissionTotals[period];
 const filters=[['today','今天'],['yesterday','昨天'],['currentMonth','本月'],['lastMonth','上月'],['custom',commissionMonth?commissionMonth.replace('-',''):'筛选']];
 return `<div class="commission-filter" aria-label="提成日期">${filters.map(([key,label])=>
  `<button class="soft" data-period="${key}" aria-pressed="${period===key}">${label}</button>`).join('')}</div>
 ${isCustom?`<label>选择月份<input id="commission-month" type="month" min="2024-06" max="2026-11" value="${commissionMonth||'2026-11'}"></label>`:''}
 ${rows.length?`<div class="commission-summary"><small>总提成(元)</small><strong>${total.toFixed(2)}</strong></div>
 <h3 class="section">提成详情</h3>
 ${rows.map(entry=>`<article class="card commission-entry"><div class="split"><h3>${entry.project}</h3><strong>+${entry.amount.toFixed(2)}</strong></div>
 <dl><div><dt>上钟时间</dt><dd>2026/${entry.time}</dd></div><div><dt>门店</dt><dd>杭州宝龙店</dd></div><div><dt>项目时长</dt><dd>${entry.duration}分钟</dd></div><div><dt>上钟类型</dt><dd>轮钟</dd></div><div class="commission-order"><dt>订单ID</dt><dd>${entry.id}</dd></div></dl></article>`).join('')}
 <p>已经到底啦～</p>`:'<p>暂无内容～</p>'}`;
}
const detail={
training:['手法复训','<span class="tag">已安排</span><p>11 月 12 日 14:00–16:00 · 培训部</p><p>本次重点练习肩颈力度控制与服务中确认。复训时段不可预约。</p>'],
tip:['顾客觉得力度太轻，怎么处理？','<p>开始前问清力度和加强部位。调整后，主动确认「现在这个力度合适吗？」</p><p>下钟后向前台同步顾客偏好，方便下次安排。</p>'],
story:['记住客人每次都想加强的肩颈','<p>宝龙店 · 贝贝</p><p>上次服务后，贝贝请前台记录顾客希望加强右肩、避开颈前。顾客再次预约时，接待和服务都沿用了这份记录。</p>'],
leave:['提报排休','<form data-form="leave"><label>排休日期<input type="date" required min="2026-11-11"></label><label>备注<textarea placeholder="选填"></textarea></label><button class="cta">提交主理人审核</button></form>'],
storyForm:['提报故事','<form data-form="story"><label>提报对象<select><option>自己</option><option>同事</option></select></label><label>故事标题<input required maxlength="40"></label><label>发生了什么<textarea required></textarea></label><button class="cta">提交提报</button></form>'],
quiz:['理论练习','<form data-form="quiz"><p><strong>顾客反馈肩颈力度偏轻时，下一步怎么做？</strong></p><label><input type="radio" name="answer" value="correct" required> 沟通后逐步调整，并再次确认</label><label><input type="radio" name="answer" value="wrong"> 直接加到最大力度</label><label><input type="radio" name="answer" value="wrong"> 保持原力度做到结束</label><button class="cta">查看解析</button></form>'],
growth:['升级宝典','<p><strong>中级 → 高级</strong></p><div class="card"><h3>理论练习</h3><div class="meter"><i id="meter"></i></div><p>最近 <span id="score"></span> 分 · 目标 90 分以上</p><button class="soft" data-open="quiz">去刷题</button></div><div class="card"><h3>服务反馈</h3><p>遇到力度不合适，先询问并调整，结束前确认感受。</p></div><p>等级条件与薪资增幅待公布。</p>'],
milestone:['成长记录','<p>任职 3 个月 · 完成门店带教</p><p>任职 6 个月 · 累计 2 次服务表彰</p>'],
anniversary:['周年权益','<p>任职满一年后解锁周年里程碑。</p><p>具体权益以门店公布为准。</p>'],

repeat:['30 天复购率','<p>近 30 天复购率 32%。</p>'],
point:['点钟','<p>本月点钟 12 次。</p>'],
review:['线上好评','<p>本月收到 16 条线上好评。到店满意度回访单独统计。</p><p>好评率暂未出数。</p>'],
negative:['负面评价','<p>11 月 7 日 · 手法 · 反馈肩颈力度偏轻</p><p>11 月 9 日 · 服务 · 反馈力度调整后未再次确认</p>'],
quality:['品质账户','<p>当前 96 分</p><p>11 月 7 日 · 服务流程稽查扣 4 分</p><p>暂无罚单。</p>'],
rejected:['排休申请未通过','<p>原申请日期　11 月 8 日</p><p>驳回原因　当日人手不足，请重新选择日期。</p>'+button('重新提报','leave')]
};
function openDetail(id){
 const customer=state.assignment;
 const [title,body]=id==='assignedGuest'
  ? [customer.name+' · 本次服务',`<p>服务项目　${customer.service}</p><p>力度偏好　${customer.pressure}</p><p>加强部位　${customer.focus}</p><p>避开部位　${customer.avoid}</p><p>常用精油　${customer.oil}</p>`]
  : detail[id];
 if(state.page==='消息'&&messages.some(([key])=>key===id)){state.read.add(id);render()}
 $('title').textContent=title;
 $('sheet').innerHTML=body;
 if(id==='growth'){$('meter').style.width=state.score+'%';$('score').textContent=state.score}
 if(!$('dialog').open)$('dialog').showModal()
}
let toastTimer;
function notice(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
document.addEventListener('click',event=>{
 const el=event.target.closest('button');
 if(event.target===$('dialog')){
  const bounds=$('dialog').getBoundingClientRect();
  if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)$('dialog').close();
  return
 }
 if(!el)return;
 const {page,open,act,period,workTab}=el.dataset;
 if(workTab){
  state.workTab=workTab;
  render();
  $('main').scrollTop=0;
  $('main').querySelector('[data-work-tab="'+workTab+'"]').focus({preventScroll:true});
 }
 if(period){
  commissionPeriod=period;
  if(period==='custom'&&!commissionMonth)commissionMonth='2026-11';
  document.querySelector('.work-commission').innerHTML=commissionDetails();
  $('main').querySelector('[data-period="'+period+'"]').focus({preventScroll:true})
 }
 if(page){state.page=page;render();$('main').scrollTop=0}
 if(open)openDetail(open);
 if(act==='toggleAssignment'){
  state.assignment=state.assignment?null:demoAssignment;
  render();
  document.querySelector('[data-act="toggleAssignment"]').focus({preventScroll:true})
 }
 if(act==='vote'){state.voted=!state.voted;render();notice(state.voted?'已送出藕尖':'已撤回藕尖')}
 if(el.id==='close')$('dialog').close()
});
document.addEventListener('change',event=>{
 const input=event.target;
 if(input.id==='commission-month'){
  if(!input.value||!input.validity.valid)return;
  commissionMonth=input.value;
  document.querySelector('.work-commission').innerHTML=commissionDetails();
  $('commission-month').focus({preventScroll:true});
  return
 }
});
document.addEventListener('submit',event=>{
 const form=event.target;
 event.preventDefault();
 const kind=form.dataset.form;
 if(kind==='quiz'){
  const correct=new FormData(form).get('answer')==='correct';
  state.score=correct?94:86;
  $('sheet').innerHTML='<p><strong>'+(correct?'回答正确':'再想一想')+'</strong></p><p>先沟通力度偏好，逐步调整，再请顾客确认感受。</p>'+button('再练一次','quiz');
  render();return
 }
 if(kind==='leave'){state.leave=form.querySelector('input').value;notice('已提报，待主理人审核')}
 if(kind==='story'){state.story=form.querySelector('input').value;notice('已提报，等待核实')}
 $('dialog').close();render();
 const returnTo=kind==='story'?'storyForm':kind;
 document.querySelector('[data-open="'+returnTo+'"]')?.focus({preventScroll:true})
});
render();
</script>
